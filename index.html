<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>GNOME Desktop · Rubén Cobos</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:opsz@14..32&display=swap" rel="stylesheet">
    <style>
        /* ---------- RESET Y BASE ---------- */
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            user-select: none;
            -webkit-tap-highlight-color: transparent;
        }

        body {
            font-family: 'Inter', 'Cantarell', sans-serif;
            background: #1a1a1a;
            height: 100vh;
            overflow: hidden;
            background-image:
                radial-gradient(circle at 20% 30%, rgba(255,255,255,0.025) 1px, transparent 1px),
                radial-gradient(circle at 80% 70%, rgba(255,255,255,0.02) 1px, transparent 1px);
            background-size: 30px 30px, 40px 40px;
            background-color: #1a1a1a;
            color: #eeeeee;
            transition: background-image 0.5s ease, background-color 0.5s ease;
            touch-action: none;
        }
        body.wallpaper-set {
            background-size: cover;
            background-position: center;
            background-repeat: no-repeat;
            background-image: var(--wallpaper, none) !important;
        }

        /* ---------- BARRA SUPERIOR (GNOME Shell) ---------- */
        .gnome-top-bar {
            position: fixed;
            top: 0;
            left: 0;
            right: 0;
            height: 44px;
            background: rgba(0, 0, 0, 0.75);
            backdrop-filter: blur(12px);
            -webkit-backdrop-filter: blur(12px);
            display: flex;
            align-items: center;
            justify-content: space-between;
            padding: 0 16px;
            z-index: 1000;
            border-bottom: 1px solid rgba(255,255,255,0.05);
        }
        .top-left, .top-center, .top-right {
            display: flex;
            align-items: center;
            gap: 14px;
        }
        .top-left {
            font-weight: 500;
            font-size: 0.9rem;
            color: #eeeeee;
        }
        .top-left .activities-btn {
            background: rgba(255,255,255,0.06);
            padding: 4px 14px;
            border-radius: 20px;
            cursor: pointer;
            transition: background 0.2s;
            font-weight: 500;
            color: #eeeeee;
            display: flex;
            align-items: center;
            gap: 6px;
            touch-action: manipulation;
        }
        .top-left .activities-btn:hover {
            background: rgba(255,255,255,0.12);
        }
        .top-left .activities-btn .dot {
            display: inline-block;
            width: 8px;
            height: 8px;
            background: #3584e4;
            border-radius: 50%;
            margin-right: 4px;
        }
        .top-center {
            font-size: 0.9rem;
            background: rgba(255,255,255,0.04);
            padding: 4px 16px;
            border-radius: 30px;
            color: #eeeeee;
            letter-spacing: 0.3px;
            white-space: nowrap;
        }
        .top-right {
            font-size: 1rem;
            color: #cccccc;
            gap: 8px;
        }
        .top-right .icons {
            display: flex;
            gap: 12px;
        }
        .top-right .lang-btn,
        .top-right .wallpaper-btn {
            background: rgba(255,255,255,0.08);
            padding: 4px 12px;
            border-radius: 20px;
            font-size: 0.75rem;
            font-weight: 600;
            cursor: pointer;
            transition: background 0.2s;
            border: none;
            color: #eeeeee;
            display: flex;
            align-items: center;
            gap: 4px;
            touch-action: manipulation;
            min-height: 32px;
        }
        .top-right .lang-btn:hover,
        .top-right .wallpaper-btn:hover {
            background: rgba(255,255,255,0.16);
        }
        .top-right .wallpaper-btn {
            font-size: 1rem;
            padding: 2px 10px;
        }

        /* ---------- ESCRITORIO ---------- */
        .desktop {
            position: fixed;
            top: 44px;
            left: 0;
            right: 0;
            bottom: 0;
            padding: 30px 20px;
            display: flex;
            flex-direction: column;
            flex-wrap: wrap;
            align-content: flex-start;
            gap: 20px 40px;
            overflow-y: auto;
            z-index: 1;
            touch-action: pan-y;
        }

        /* ---------- DASH (panel de aplicaciones) ---------- */
        .gnome-dash {
            position: fixed;
            bottom: 20px;
            left: 50%;
            transform: translateX(-50%);
            background: rgba(0, 0, 0, 0.7);
            backdrop-filter: blur(16px);
            -webkit-backdrop-filter: blur(16px);
            border-radius: 20px;
            padding: 8px 16px;
            display: flex;
            gap: 12px;
            z-index: 500;
            border: 1px solid rgba(255,255,255,0.06);
            box-shadow: 0 8px 30px rgba(0,0,0,0.5);
            touch-action: manipulation;
        }
        .dash-icon {
            display: flex;
            flex-direction: column;
            align-items: center;
            cursor: pointer;
            padding: 6px 8px;
            border-radius: 12px;
            transition: background 0.2s, transform 0.15s;
            color: #cccccc;
            font-size: 0.7rem;
            gap: 2px;
            touch-action: manipulation;
            min-width: 44px;
            min-height: 44px;
            justify-content: center;
        }
        .dash-icon:hover {
            background: rgba(255,255,255,0.08);
            transform: scale(1.05);
            color: #ffffff;
        }
        .dash-icon .icon {
            font-size: 1.6rem;
            filter: drop-shadow(0 2px 4px rgba(0,0,0,0.4));
        }
        .dash-icon .label {
            font-size: 0.6rem;
            opacity: 0.7;
        }
        .dash-icon.active .label {
            opacity: 1;
            color: #3584e4;
        }

        /* ---------- VENTANAS (estilo Adwaita) ---------- */
        .window {
            position: fixed;
            background: #2e3436;
            border-radius: 12px;
            box-shadow: 0 24px 80px rgba(0,0,0,0.9), 0 0 0 1px rgba(255,255,255,0.04);
            display: flex;
            flex-direction: column;
            min-width: 320px;
            min-height: 280px;
            z-index: 100;
            resize: both;
            overflow: hidden;
            transition: opacity 0.2s, transform 0.2s;
            touch-action: none;
        }
        .window.hidden {
            display: none !important;
        }
        .window.maximized {
            top: 44px !important;
            left: 0 !important;
            width: 100% !important;
            height: calc(100% - 44px) !important;
            border-radius: 0;
            resize: none;
        }

        /* Barra de título (HeaderBar) */
        .window-titlebar {
            background: #2e3436;
            padding: 0 8px;
            min-height: 44px;
            display: flex;
            align-items: center;
            justify-content: space-between;
            cursor: grab;
            flex-shrink: 0;
            border-bottom: 1px solid rgba(255,255,255,0.04);
            touch-action: none;
        }
        .window-titlebar:active {
            cursor: grabbing;
        }
        .window-title {
            color: #eeeeee;
            font-size: 0.9rem;
            font-weight: 500;
            opacity: 0.9;
            overflow: hidden;
            text-overflow: ellipsis;
            white-space: nowrap;
            padding-left: 12px;
            flex: 1;
        }
        .window-controls {
            display: flex;
            gap: 4px;
            padding-right: 4px;
            order: 2;
        }
        .win-btn {
            width: 28px;
            height: 28px;
            border-radius: 50%;
            border: none;
            cursor: pointer;
            transition: background-color 0.2s;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 14px;
            color: #eeeeee;
            background: transparent;
            position: relative;
            touch-action: manipulation;
        }
        .win-btn:hover {
            background-color: rgba(255,255,255,0.08);
        }
        .win-btn.close:hover {
            background-color: #c01c28;
            color: white;
        }
        .win-btn.minimize:hover {
            background-color: rgba(255,255,255,0.12);
        }
        .win-btn.maximize:hover {
            background-color: rgba(255,255,255,0.12);
        }
        .win-btn.close::before {
            content: "✕";
            font-size: 14px;
            opacity: 0.7;
        }
        .win-btn.minimize::before {
            content: "−";
            font-size: 18px;
            opacity: 0.7;
            line-height: 1;
        }
        .win-btn.maximize::before {
            content: "□";
            font-size: 14px;
            opacity: 0.7;
        }
        .win-btn.close:hover::before,
        .win-btn.minimize:hover::before,
        .win-btn.maximize:hover::before {
            opacity: 1;
        }

        /* Contenido de la ventana */
        .window-body {
            flex: 1;
            display: flex;
            flex-direction: column;
            overflow: hidden;
            background: #2e3436;
        }
        .window-body .nav-bar {
            background: #242a2c;
            padding: 6px 16px;
            display: flex;
            align-items: center;
            gap: 12px;
            border-bottom: 1px solid rgba(255,255,255,0.04);
            flex-shrink: 0;
        }
        .window-body .nav-bar .path {
            color: #bbbbbb;
            font-size: 0.8rem;
        }
        .window-body .nav-bar .path span { color: #3584e4; }
        .window-body .nav-bar .search-icon {
            margin-left: auto;
            color: #888;
        }

        .window-body .content-area {
            display: flex;
            flex: 1;
            overflow: hidden;
        }
        .window-body .sidebar {
            width: 170px;
            background: #242a2c;
            padding: 10px 0;
            border-right: 1px solid rgba(255,255,255,0.04);
            flex-shrink: 0;
            overflow-y: auto;
            touch-action: pan-y;
        }
        .window-body .sidebar-item {
            display: flex;
            align-items: center;
            gap: 10px;
            padding: 8px 16px;
            color: #cccccc;
            font-size: 0.85rem;
            cursor: pointer;
            transition: background 0.15s, color 0.15s;
            border-left: 3px solid transparent;
            touch-action: manipulation;
            min-height: 40px;
        }
        .window-body .sidebar-item:hover {
            background: rgba(255,255,255,0.04);
            color: #ffffff;
        }
        .window-body .sidebar-item.active {
            background: rgba(53,132,228,0.15);
            color: #3584e4;
            border-left-color: #3584e4;
        }
        .window-body .sidebar-item .icon { font-size: 1.1rem; width: 24px; text-align: center; }

        .window-body .main-content {
            flex: 1;
            padding: 20px 24px;
            overflow-y: auto;
            background: #2e3436;
            touch-action: pan-y;
        }
        .window-body .main-content h2 {
            font-size: 1.4rem;
            font-weight: 600;
            margin-bottom: 12px;
            color: #eeeeee;
        }
        .window-body .main-content p, .window-body .main-content li {
            font-size: 0.9rem;
            line-height: 1.6;
            color: #dddddd;
        }
        .window-body .main-content ul {
            list-style: none;
            padding: 0;
        }
        .window-body .main-content ul li {
            padding: 3px 0;
            display: flex;
            align-items: center;
            gap: 6px;
        }
        .window-body .main-content ul li::before {
            content: "▹";
            color: #3584e4;
        }
        .window-body .main-content .project-item {
            background: #242a2c;
            border-radius: 6px;
            padding: 12px 16px;
            margin-bottom: 12px;
            border-left: 4px solid #3584e4;
        }
        .window-body .main-content .project-item h3 {
            font-size: 1rem;
            font-weight: 600;
            color: #eeeeee;
        }
        .window-body .main-content .project-item p {
            font-size: 0.85rem;
            color: #bbbbbb;
        }
        .window-body .main-content .contact-info {
            background: #242a2c;
            border-radius: 6px;
            padding: 12px 16px;
            border-left: 4px solid #26a269;
        }
        .window-body .main-content .contact-info a {
            color: #3584e4;
            text-decoration: none;
        }

        /* Terminal específica */
        .terminal-window .window-body {
            background: #1a1a1a;
        }
        .terminal-output {
            flex: 1;
            padding: 12px 16px;
            font-family: 'Inter', monospace;
            font-size: 0.85rem;
            color: #aaaaaa;
            overflow-y: auto;
            white-space: pre-wrap;
            word-break: break-word;
            line-height: 1.5;
            touch-action: pan-y;
        }
        .terminal-output .prompt { color: #26a269; }
        .terminal-output .cmd { color: #eeeeee; }
        .terminal-input-row {
            display: flex;
            align-items: center;
            padding: 6px 16px 12px 16px;
            gap: 8px;
            background: #1a1a1a;
            border-top: 1px solid rgba(255,255,255,0.03);
            touch-action: manipulation;
        }
        .terminal-input-row span { color: #26a269; font-weight: 600; }
        .terminal-input-row input {
            flex: 1;
            background: transparent;
            border: none;
            outline: none;
            color: #eeeeee;
            font-family: 'Inter', monospace;
            font-size: 0.85rem;
            padding: 6px 0;
            border-bottom: 1px solid rgba(255,255,255,0.1);
            min-height: 36px;
            touch-action: manipulation;
        }
        .terminal-input-row input:focus { border-bottom-color: #3584e4; }

        /* Scrollbar oscura */
        ::-webkit-scrollbar { width: 5px; height: 5px; }
        ::-webkit-scrollbar-track { background: #1a1a1a; }
        ::-webkit-scrollbar-thumb { background: #444; border-radius: 8px; }
        ::-webkit-scrollbar-thumb:hover { background: #555; }

        /* ---------- RESPONSIVE MÓVIL ---------- */
        @media (max-width: 700px) {
            .window {
                min-width: 0;
                min-height: 0;
                width: 92% !important;
                height: 80% !important;
                left: 4% !important;
                top: 10% !important;
                border-radius: 16px;
            }
            .window.maximized {
                top: 44px !important;
                left: 0 !important;
                width: 100% !important;
                height: calc(100% - 44px) !important;
                border-radius: 0;
            }
            .window-body .sidebar {
                width: 130px;
            }
            .window-body .sidebar-item {
                font-size: 0.75rem;
                padding: 6px 12px;
                min-height: 36px;
            }
            .window-body .main-content {
                padding: 14px 16px;
            }
            .gnome-dash {
                padding: 6px 12px;
                gap: 8px;
                bottom: 10px;
                border-radius: 16px;
            }
            .dash-icon {
                min-width: 40px;
                min-height: 40px;
                padding: 4px 6px;
            }
            .dash-icon .icon { font-size: 1.4rem; }
            .dash-icon .label { font-size: 0.5rem; }

            .gnome-top-bar {
                padding: 0 10px;
                height: 40px;
            }
            .top-left .activities-btn {
                font-size: 0.7rem;
                padding: 2px 10px;
            }
            .top-center {
                font-size: 0.7rem;
                padding: 2px 8px;
            }
            .top-right .icons {
                gap: 6px;
                font-size: 0.8rem;
            }
            .top-right .lang-btn,
            .top-right .wallpaper-btn {
                font-size: 0.65rem;
                padding: 2px 8px;
                min-height: 28px;
            }
            .top-right .wallpaper-btn {
                font-size: 0.9rem;
                padding: 2px 6px;
            }
            .window-title {
                font-size: 0.8rem;
                padding-left: 8px;
            }
            .win-btn {
                width: 24px;
                height: 24px;
                font-size: 12px;
            }
            .win-btn.close::before,
            .win-btn.minimize::before,
            .win-btn.maximize::before {
                font-size: 12px;
            }
            .terminal-output {
                font-size: 0.8rem;
                padding: 10px 12px;
            }
            .terminal-input-row input {
                font-size: 0.8rem;
                min-height: 32px;
            }
            .window-body .main-content h2 {
                font-size: 1.2rem;
            }
            .window-body .main-content p,
            .window-body .main-content li {
                font-size: 0.85rem;
            }
        }

        @media (max-width: 480px) {
            .window {
                width: 96% !important;
                left: 2% !important;
                top: 8% !important;
                height: 84% !important;
            }
            .window-body .sidebar {
                width: 110px;
            }
            .window-body .sidebar-item {
                font-size: 0.7rem;
                padding: 4px 10px;
                gap: 6px;
                min-height: 32px;
            }
            .window-body .sidebar-item .icon {
                font-size: 0.9rem;
                width: 20px;
            }
            .window-body .main-content {
                padding: 10px 12px;
            }
            .gnome-dash {
                padding: 4px 8px;
                gap: 4px;
                bottom: 6px;
                border-radius: 14px;
            }
            .dash-icon {
                min-width: 36px;
                min-height: 36px;
                padding: 2px 4px;
            }
            .dash-icon .icon { font-size: 1.2rem; }
            .dash-icon .label { font-size: 0.4rem; }
            .top-center {
                font-size: 0.6rem;
                padding: 2px 6px;
            }
            .top-left .activities-btn {
                font-size: 0.6rem;
                padding: 2px 8px;
            }
            .top-right .icons {
                gap: 4px;
                font-size: 0.7rem;
            }
            .top-right .lang-btn,
            .top-right .wallpaper-btn {
                font-size: 0.55rem;
                padding: 2px 6px;
                min-height: 24px;
            }
            .top-right .wallpaper-btn {
                font-size: 0.8rem;
                padding: 2px 4px;
            }
            .window-title {
                font-size: 0.7rem;
                padding-left: 6px;
            }
            .win-btn {
                width: 20px;
                height: 20px;
                font-size: 10px;
            }
            .win-btn.close::before,
            .win-btn.minimize::before,
            .win-btn.maximize::before {
                font-size: 10px;
            }
            .terminal-output {
                font-size: 0.7rem;
                padding: 8px 10px;
            }
            .terminal-input-row input {
                font-size: 0.7rem;
                min-height: 28px;
            }
            .window-body .main-content h2 {
                font-size: 1rem;
            }
            .window-body .main-content p,
            .window-body .main-content li {
                font-size: 0.8rem;
            }
        }
    </style>
</head>
<body>

    <!-- BARRA SUPERIOR GNOME -->
    <header class="gnome-top-bar">
        <div class="top-left">
            <span class="activities-btn">
                <span class="dot"></span> <span id="activitiesLabel">Activities</span>
            </span>
        </div>
        <div class="top-center" id="clockDisplay">Cargando...</div>
        <div class="top-right">
            <div class="icons">
                <span>📶</span><span>🔊</span><span>🔋</span><span>⚙️</span>
            </div>
            <button class="wallpaper-btn" id="wallpaperBtn" title="Change wallpaper (right-click to reset)">🖼️</button>
            <button class="lang-btn" id="langToggle">ES</button>
        </div>
    </header>

    <!-- ESCRITORIO -->
    <div class="desktop" id="desktop"></div>

    <!-- DASH -->
    <div class="gnome-dash" id="dash">
        <div class="dash-icon active" data-window="portafolio">
            <span class="icon">📁</span>
            <span class="label" data-i18n="dash-portfolio">Portfolio</span>
        </div>
        <div class="dash-icon" data-window="terminal">
            <span class="icon">🖥️</span>
            <span class="label" data-i18n="dash-terminal">Terminal</span>
        </div>
        <div class="dash-icon" data-window="contacto">
            <span class="icon">✉️</span>
            <span class="label" data-i18n="dash-contact">Contact</span>
        </div>
    </div>

    <!-- VENTANA PORTAFOLIO -->
    <div id="window-portafolio" class="window" style="width: 780px; height: 560px; top: 70px; left: 60px;">
        <div class="window-titlebar" data-window="portafolio">
            <span class="window-title" data-i18n="window-portfolio-title">Portfolio of Rubén</span>
            <div class="window-controls">
                <button class="win-btn minimize" data-action="minimize" aria-label="Minimize"></button>
                <button class="win-btn maximize" data-action="maximize" aria-label="Maximize"></button>
                <button class="win-btn close" data-action="close" aria-label="Close"></button>
            </div>
        </div>
        <div class="window-body">
            <div class="nav-bar">
                <span class="path">📁 <span>~/Portfolio</span></span>
                <span class="search-icon">🔍</span>
            </div>
            <div class="content-area">
                <div class="sidebar" id="sidebar-portafolio">
                    <div class="sidebar-item active" data-section="inicio"><span class="icon">🏠</span> <span data-i18n="nav-home">Home</span></div>
                    <div class="sidebar-item" data-section="sobremi"><span class="icon">👤</span> <span data-i18n="nav-about">About</span></div>
                    <div class="sidebar-item" data-section="habilidades"><span class="icon">⚙️</span> <span data-i18n="nav-skills">Skills</span></div>
                    <div class="sidebar-item" data-section="proyectos"><span class="icon">🧪</span> <span data-i18n="nav-projects">Projects</span></div>
                    <div class="sidebar-item" data-section="contacto"><span class="icon">✉️</span> <span data-i18n="nav-contact">Contact</span></div>
                </div>
                <div class="main-content" id="mainContent-portafolio"></div>
            </div>
        </div>
    </div>

    <!-- VENTANA TERMINAL -->
    <div id="window-terminal" class="window terminal-window hidden" style="width: 520px; height: 340px; top: 130px; left: 280px; display: none;">
        <div class="window-titlebar" data-window="terminal">
            <span class="window-title" data-i18n="window-terminal-title">Terminal · Rubén</span>
            <div class="window-controls">
                <button class="win-btn minimize" data-action="minimize" aria-label="Minimize"></button>
                <button class="win-btn maximize" data-action="maximize" aria-label="Maximize"></button>
                <button class="win-btn close" data-action="close" aria-label="Close"></button>
            </div>
        </div>
        <div class="window-body">
            <div class="terminal-output" id="terminalOutput">
                <span class="prompt">$</span> <span class="cmd" data-i18n="terminal-welcome">Welcome. Type 'help' for assistance.</span>
            </div>
            <div class="terminal-input-row">
                <span>$</span>
                <input type="text" id="terminalInput" placeholder="Command..." autofocus>
            </div>
        </div>
    </div>

    <!-- Input oculto para seleccionar imagen de fondo -->
    <input type="file" id="wallpaperInput" accept="image/*" style="display:none;">

    <script>
